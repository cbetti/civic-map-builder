[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "civic-map-builder"
version = "0.1.0"
description = "CLI tool to validate civic association boundary contributions and render PNG maps."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Chris Betti", email = "cbetti@gmail.com" }
]
dependencies = [
  "typer>=0.12.0",
  "pillow>=10.0.0",
  "shapely>=2.0.0",
  "pyyaml>=6.0",
]

[project.scripts]
civic-map-builder = "civic_map_builder.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
]
basemap = [
  "osmium>=4.0.0",
  "platformdirs>=4.0.0",
  "requests>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["civic_map_builder*"]

[tool.ruff]
line-length = 100
target-version = "py310"
